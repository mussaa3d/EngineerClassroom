<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Course Classroom</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a8a"/>
      <stop offset="1" stop-color="#0b6e74"/>
    </linearGradient>
    <pattern id="mm" width="16" height="16" patternUnits="userSpaceOnUse" x="96" y="96">
      <path d="M16 0H0V16" fill="none" stroke="#f3c7a6" stroke-width="1"/>
    </pattern>
    <pattern id="cm" width="80" height="80" patternUnits="userSpaceOnUse" x="96" y="96">
      <path d="M80 0H0V80" fill="none" stroke="#e6874c" stroke-width="2"/>
    </pattern>
    <clipPath id="sheet"><rect x="96" y="96" width="320" height="320" rx="10"/></clipPath>
  </defs>
  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the sheet of graph paper, slightly turned -->
  <g transform="rotate(-6 256 256)">
    <rect x="96" y="96" width="320" height="320" rx="10" fill="#ffffff"/>
    <g clip-path="url(#sheet)">
      <rect x="96" y="96" width="320" height="320" fill="url(#mm)"/>
      <rect x="96" y="96" width="320" height="320" fill="url(#cm)"/>
    </g>
    <!-- axes -->
    <path d="M128 384H392M128 384V124" fill="none" stroke="#2f3338" stroke-width="7" stroke-linecap="round"/>
    <!-- diagonal and an equilibrium-like curve -->
    <path d="M128 384L384 128" fill="none" stroke="#9aa3ad" stroke-width="4" stroke-dasharray="10 9"/>
    <path d="M128 384C150 250 220 170 384 128" fill="none" stroke="#1f3a8a" stroke-width="9" stroke-linecap="round"/>
    <!-- the solution, stepped off one stage at a time -->
    <path d="M352 160H292V220H204V308H148V364" fill="none" stroke="#e8590c" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="352" cy="160" r="11" fill="#e8590c"/>
  </g>
  <!-- pen writing the next step -->
  <g transform="translate(177 392) rotate(135)">
    <rect x="-15" y="-112" width="30" height="104" rx="7" fill="#ffd43b" stroke="#2f3338" stroke-width="5"/>
    <rect x="-15" y="-112" width="30" height="22" rx="6" fill="#2f3338"/>
    <path d="M-15 -8L0 24L15 -8Z" fill="#f8e4c8" stroke="#2f3338" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-4 15L0 24L4 15Z" fill="#2f3338"/>
  </g>
</svg>
